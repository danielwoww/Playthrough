name: Release

# Builds a signed APK on GitHub's servers and publishes it as a GitHub release.
# Run it by pushing a version tag:  git tag v1.0.0 && git push origin v1.0.0

on:
  push:
    tags: ["v*"]

permissions:
  contents: write      # create the release
  id-token: write      # sign the build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew --no-daemon testDebugUnitTest

      - name: Build signed release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          PLAYTHROUGH_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          PLAYTHROUGH_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          PLAYTHROUGH_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          export PLAYTHROUGH_KEYSTORE="$RUNNER_TEMP/release.jks"
          ./gradlew --no-daemon assembleRelease
          rm "$RUNNER_TEMP/release.jks"

      - name: Verify signature and prepare files
        id: files
        run: |
          APK="Playthrough-${GITHUB_REF_NAME}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$APK"
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --print-certs "$APK" | tee signer.txt
          sha256sum "$APK" > "$APK.sha256"
          CERT=$(grep -m1 "certificate SHA-256 digest" signer.txt | awk '{print $NF}')
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "cert=$CERT" >> "$GITHUB_OUTPUT"

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: ${{ steps.files.outputs.apk }}

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          APK: ${{ steps.files.outputs.apk }}
          CERT: ${{ steps.files.outputs.cert }}
        run: |
          cat > notes.md <<EOF
          Download **$APK** below and open it on your Android phone (Android 8.0 or newer).

          ### Verify the download
          - **SHA-256 of the APK:** \`$(cut -d' ' -f1 "$APK.sha256")\`
          - **Signing certificate SHA-256:** \`$CERT\`
            Every Playthrough release is signed with this same certificate.
          - **Build provenance:** this APK was built by GitHub Actions from the tagged source.
            Check it with \`gh attestation verify $APK --repo $GITHUB_REPOSITORY\`.
          EOF
          gh release create "$GITHUB_REF_NAME" "$APK" "$APK.sha256" \
            --title "Playthrough $GITHUB_REF_NAME" --notes-file notes.md
